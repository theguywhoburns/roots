[package]
name = "roots-client"
version = "0.1.0"
edition = "2024"

# The binary keeps the crate's name: it is the node the user runs.
[[bin]]
name = "roots"
path = "src/main.rs"

[dependencies]
roots = { path = ".." }
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "io-util", "sync"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
socket2 = "0.6.5"
